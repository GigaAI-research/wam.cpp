name: CPU release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build patch protobuf-compiler python3-venv
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy Pillow protobuf websockets PyYAML
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWAM_BUILD_TESTS=ON
          -DWAM_CUDA=OFF
      - name: Build
        run: cmake --build build --parallel 1
      - name: Test
        run: ctest --test-dir build --output-on-failure
