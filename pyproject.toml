[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam"
version = "0.6.0"
description = "Python SDK for local and remote wam.cpp policy inference"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
remote = ["protobuf>=4", "websockets>=12"]
language = ["transformers>=4"]

[project.scripts]
wam-predict = "wam.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
